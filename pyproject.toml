[project]
name = "interview-pioneer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "王舜尧", email = "895526906@qq.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.4.7",
    "langchain-openai>=1.7.3",
    "openpyxl>=3.1.5",
    "pandas>=3.1.0",
    "pymupdf>=2.0",
    "pypdf2>=3.0.1",
    "python-dotenv>=1.2.4",
    "rapidocr-onnxruntime>=1.4.4",
    "streamlit>=1.66.1",
]

[project.scripts]
interview-pioneer = "interview_pioneer:main"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"
